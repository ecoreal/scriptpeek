name: Feature request
description: Suggest a new capability or an improvement to an existing one.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        scriptpeek intentionally stays small, zero-dependency, and read-only.
        Ideas that fit that niche are most likely to be accepted — see the
        [Roadmap](https://github.com/ecoreal/scriptpeek#roadmap) first, your
        idea may already be planned.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to find out or protect against, and where does the current behavior fall short?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The command, flag, or output you would expect. Sketch the output shape if it affects `--json`.
      render: text
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools, flags, or workarounds you tried or considered, and why they do not fit.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — lockfile shapes involved, CI environment, links.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and the Roadmap section of the README before opening this.
          required: true
        - label: I am willing to submit a pull request for this feature.
          required: false
